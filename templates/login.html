<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · Grok 自动注册工具</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%23229ed9'/%3E%3Cstop offset='1' stop-color='%2338bdf8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M9 16.5 13.2 20.5 23 10.5' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/css/style.css?v=3.11">
    <script>
        (function () {
            const theme = localStorage.getItem('theme') || 'light';
            if (theme === 'dark') {
                document.documentElement.classList.add('dark-theme');
            }
            document.documentElement.dataset.theme = theme;
        })();
    </script>
</head>
<body class="login-body">
    <div class="bg-aurora" aria-hidden="true"><i></i><i></i></div>

    <main class="login-shell">
        <form class="login-card" method="post" action="/login" autocomplete="off">
            <div class="login-brand">
                <div class="brand-dot" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12.5 11.4 15 15.5 9.5"/><path d="M4 8.5V7a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v1.5"/><path d="M4 15.5V17a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-1.5"/></svg>
                </div>
                <div>
                    <strong>Grok Register</strong>
                    <span>Ops Console</span>
                </div>
            </div>

            <h1 class="login-title">管理员登录</h1>
            <p class="login-desc">请输入管理口令以访问控制台。</p>

            {% if error %}
            <p class="login-error" role="alert">{{ error }}</p>
            {% endif %}

            <div class="form-group">
                <label for="password">管理口令</label>
                <input
                    class="form-input"
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                    autofocus
                    {% if retry_after %}disabled{% endif %}>
            </div>

            <button class="btn btn-primary login-submit" type="submit" {% if retry_after %}disabled{% endif %}>
                登录
            </button>

            <p class="login-note">
                会话有效期 7 天。忘记口令请在服务端重新生成哈希并重启容器。
            </p>
        </form>
    </main>
</body>
</html>
